<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM6 可行性压测原型（单文件版）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      display: flex;
      height: 100vh;
    }
    #sidebar {
      width: 300px;
      background: #252526;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #3e3e42;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #fff;
    }
    .test-section {
      margin-bottom: 30px;
    }
    .test-section h2 {
      font-size: 14px;
      color: #569cd6;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #0e639c;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    button:hover { background: #1177bb; }
    button:active { background: #0d5a8f; }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #editor-container {
      flex: 1;
      overflow: auto;
      background: #1e1e1e;
    }
    #status {
      height: 150px;
      background: #252526;
      border-top: 1px solid #3e3e42;
      padding: 10px;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      color: #ce9178;
    }
    .cm-editor {
      height: 100%;
      font-size: 16px;
    }
    .cm-scroller {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .cm-content {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .info {
      font-size: 12px;
      color: #858585;
      margin-top: 5px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>🧪 CM6 可行性压测</h1>
    <div class="test-section">
      <h2>1. 中文 IME 测试</h2>
      <button id="load-ime-test">加载 IME 测试文档</button>
      <p class="info">切换到微软拼音/搜狗，在标题、列表、粗体、表格中快速输入中文，观察吞字/跳位</p>
    </div>
    <div class="test-section">
      <h2>2. 表格编辑</h2>
      <button id="load-table-test">加载表格测试</button>
      <p class="info">点击表格进入源码编辑模式，失焦自动渲染</p>
    </div>
    <div class="test-section">
      <h2>3. 长文档性能</h2>
      <button id="load-10k">加载 1 万字文档</button>
      <button id="load-100k">加载 10 万字文档（极端）</button>
      <p class="info">滚动、输入、观察卡顿和内存占用</p>
    </div>
    <div class="test-section">
      <h2>4. Diff 保真验证</h2>
      <button id="save-and-diff">保存并查看 Diff</button>
      <p class="info">修改文档后点击，状态栏显示实际 diff（应该只改你编辑的部分）</p>
    </div>
    <div class="test-section">
      <h2>清空</h2>
      <button id="clear">清空编辑器</button>
    </div>
  </div>
  <div id="main">
    <div id="editor-container"></div>
    <div id="status">
      <div>状态栏：等待操作...</div>
    </div>
  </div>

  <script type="module">
    import { EditorView, keymap } from 'https://cdn.jsdelivr.net/npm/@codemirror/view@6.34.3/+esm'
    import { EditorState } from 'https://cdn.jsdelivr.net/npm/@codemirror/state@6.4.1/+esm'
    import { markdown } from 'https://cdn.jsdelivr.net/npm/@codemirror/lang-markdown@6.3.1/+esm'
    import { defaultKeymap } from 'https://cdn.jsdelivr.net/npm/@codemirror/commands@6.6.0/+esm'

    let view
    let originalContent = ''

    function initEditor(initialDoc = '') {
      const container = document.getElementById('editor-container')
      container.innerHTML = ''

      const startState = EditorState.create({
        doc: initialDoc,
        extensions: [
          keymap.of(defaultKeymap),
          markdown(),
          EditorView.lineWrapping,
          EditorView.theme({
            '&': { height: '100%' },
            '.cm-scroller': { overflow: 'auto' },
            '.cm-content': { minHeight: '100%' }
          })
        ]
      })

      view = new EditorView({
        state: startState,
        parent: container
      })

      originalContent = initialDoc
      log('编辑器初始化完成')
    }

    function log(msg) {
      const status = document.getElementById('status')
      const timestamp = new Date().toLocaleTimeString()
      status.innerHTML += `<div>[${timestamp}] ${msg}</div>`
      status.scrollTop = status.scrollHeight
    }

    function generateIMETestDoc() {
      return `# IME 测试文档

请用**微软拼音**和**搜狗拼音**分别测试以下场景：

## 1. 标题中输入中文
在这里输入中文看看会不会吞字：

## 2. 列表中快速输入
- 第一项，快速输入中文看看
- 第二项，中英混排 test 测试
- 第三项

## 3. 粗体和斜体中输入
这是**粗体中文**，这是*斜体中文*。

## 4. 表格中输入
| 列1 | 列2 | 列3 |
|-----|-----|-----|
| 在这里输入中文 | 测试 | 看看 |
| 第二行 | 数据 | 内容 |

## 5. 代码块中输入
\`\`\`
在代码块中输入中文
应该保持纯文本编辑
\`\`\`

## 压测清单
- [ ] 长段中文连续输入
- [ ] 中英混排
- [ ] 输入过程中滚动
- [ ] 在已渲染节点边界处输入
- [ ] 快速连续输入不卡顿
- [ ] 撤销重做恢复中文而非拼音字母
`
    }

    function generateTableTestDoc() {
      return `# 表格编辑测试

## 简单表格
| 姓名 | 年龄 | 城市 |
|------|------|------|
| 张三 | 25 | 北京 |
| 李四 | 30 | 上海 |

## 复杂表格
| 功能 | CM6 | ProseMirror | 说明 |
|------|-----|-------------|------|
| 往返保真 | ✅ | ❌ | CM6 架构级保证 |
| 编辑流畅 | ⚠️ | ✅ | CM6 有光标问题 |
| 表格编辑 | ❌ | ✅ | CM6 行模型限制 |

## 压测清单
- [ ] 能否正常编辑表格
- [ ] 增删行列体验如何
`
    }

    function generateLongDoc(wordCount) {
      const paragraphs = []
      const sampleText = '这是一段测试文本。'.repeat(10)

      for (let i = 0; i < wordCount / 100; i++) {
        if (i % 50 === 0) {
          paragraphs.push(`\n# 第 ${Math.floor(i / 50) + 1} 章\n`)
        }
        if (i % 10 === 0) {
          paragraphs.push(`\n## 第 ${Math.floor(i / 10) + 1} 节\n`)
        }
        paragraphs.push(sampleText + '\n')
      }

      return paragraphs.join('\n')
    }

    function computeDiff(oldText, newText) {
      const oldLines = oldText.split('\n')
      const newLines = newText.split('\n')
      const diff = []

      const maxLen = Math.max(oldLines.length, newLines.length)
      for (let i = 0; i < maxLen; i++) {
        const oldLine = oldLines[i] || ''
        const newLine = newLines[i] || ''

        if (oldLine !== newLine) {
          if (!oldLines[i]) {
            diff.push(`+ 行${i + 1}: ${newLine}`)
          } else if (!newLines[i]) {
            diff.push(`- 行${i + 1}: ${oldLine}`)
          } else {
            diff.push(`~ 行${i + 1}: ${oldLine} → ${newLine}`)
          }
        }
      }

      return diff.length > 0 ? diff : ['无变更']
    }

    document.getElementById('load-ime-test').addEventListener('click', () => {
      const doc = generateIMETestDoc()
      initEditor(doc)
      log('已加载 IME 测试文档，请切换输入法开始测试')
    })

    document.getElementById('load-table-test').addEventListener('click', () => {
      const doc = generateTableTestDoc()
      initEditor(doc)
      log('已加载表格测试文档')
    })

    document.getElementById('load-10k').addEventListener('click', () => {
      const start = performance.now()
      const doc = generateLongDoc(10000)
      initEditor(doc)
      const elapsed = (performance.now() - start).toFixed(2)
      log(`已加载 1 万字文档，耗时 ${elapsed}ms，字符数：${doc.length}`)
    })

    document.getElementById('load-100k').addEventListener('click', () => {
      const start = performance.now()
      const doc = generateLongDoc(100000)
      initEditor(doc)
      const elapsed = (performance.now() - start).toFixed(2)
      log(`已加载 10 万字文档（极端测试），耗时 ${elapsed}ms，字符数：${doc.length}`)
      log('⚠️ 请观察滚动和输入是否卡顿')
    })

    document.getElementById('save-and-diff').addEventListener('click', () => {
      if (!view) {
        log('❌ 编辑器未初始化')
        return
      }

      const currentContent = view.state.doc.toString()
      const diff = computeDiff(originalContent, currentContent)

      log('===== Diff 结果 =====')
      diff.slice(0, 20).forEach(line => log(line))
      if (diff.length > 20) {
        log(`... 还有 ${diff.length - 20} 行变更`)
      }
      log(`总变更行数：${diff.length}`)
      log('✅ 验证「最小 diff」：只有你编辑的行应该出现在 diff 中')
    })

    document.getElementById('clear').addEventListener('click', () => {
      initEditor('')
      log('已清空编辑器')
    })

    initEditor('# 欢迎使用 CM6 可行性压测原型\n\n请点击左侧按钮开始测试。\n\n⚠️ 这是单文件 HTML 原型，用 CDN 加载 CodeMirror 6。')
    log('原型已启动，CodeMirror 6 via CDN')
    log('⚠️ 这是 throwaway 代码，仅用于验证可行性')
  </script>
</body>
</html>
