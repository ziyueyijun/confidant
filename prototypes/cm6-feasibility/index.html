<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM6 可行性压测原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 300px;
      background: #252526;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #3e3e42;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #fff;
    }

    .test-section {
      margin-bottom: 30px;
    }

    .test-section h2 {
      font-size: 14px;
      color: #569cd6;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #0e639c;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }

    button:hover { background: #1177bb; }
    button:active { background: #0d5a8f; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #editor-container {
      flex: 1;
      overflow: auto;
      background: #1e1e1e;
    }

    #status {
      height: 150px;
      background: #252526;
      border-top: 1px solid #3e3e42;
      padding: 10px;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      color: #ce9178;
    }

    .cm-editor {
      height: 100%;
      font-size: 16px;
    }

    .cm-scroller {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    .cm-content {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .info {
      font-size: 12px;
      color: #858585;
      margin-top: 5px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>🧪 CM6 可行性压测</h1>

    <div class="test-section">
      <h2>1. 中文 IME 测试</h2>
      <button id="load-ime-test">加载 IME 测试文档</button>
      <p class="info">切换到微软拼音/搜狗，在标题、列表、粗体、表格中快速输入中文，观察吞字/跳位</p>
    </div>

    <div class="test-section">
      <h2>2. 表格编辑</h2>
      <button id="load-table-test">加载表格测试</button>
      <p class="info">点击表格进入源码编辑模式，失焦自动渲染</p>
    </div>

    <div class="test-section">
      <h2>3. 长文档性能</h2>
      <button id="load-10k">加载 1 万字文档</button>
      <button id="load-100k">加载 10 万字文档（极端）</button>
      <p class="info">滚动、输入、观察卡顿和内存占用</p>
    </div>

    <div class="test-section">
      <h2>4. Diff 保真验证</h2>
      <button id="save-and-diff">保存并查看 Diff</button>
      <p class="info">修改文档后点击，状态栏显示实际 diff（应该只改你编辑的部分）</p>
    </div>

    <div class="test-section">
      <h2>清空</h2>
      <button id="clear">清空编辑器</button>
    </div>
  </div>

  <div id="main">
    <div id="editor-container"></div>
    <div id="status">
      <div>状态栏：等待操作...</div>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
